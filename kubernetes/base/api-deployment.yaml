apiVersion: apps/v1
kind: Deployment
metadata:
  name: homeflow-api
  namespace: homeflow
  labels:
    app.kubernetes.io/name: homeflow-api
    app.kubernetes.io/part-of: homeflow
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: homeflow-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: homeflow-api
        app.kubernetes.io/part-of: homeflow
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: localhost:5000/homeflow/api:0.15.11
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: receipts
              mountPath: /var/lib/homeflow/receipts
          envFrom:
            - configMapRef: { name: homeflow-config }
            - secretRef: { name: homeflow-secrets }
          startupProbe:
            httpGet: { path: /health, port: http }
            failureThreshold: 10
            periodSeconds: 2
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            # Der Request ist hier kein Scheduling-Detail. Die kubelet-Eviction
            # ist auf diesem Cluster abgeschaltet und allocatable = capacity,
            # also entscheidet bei Speichermangel der Host-Kernel - nach
            # oom_score_adj, und der ergibt sich bei Burstable aus
            # 1000 - 1000 * request / capacity. Mit 32 MiB angefordert bei
            # 142 MiB echtem Verbrauch stand die API auf 996 und damit fast
            # ganz vorn in der Reihe (HF-0086 Befund 3, HF-0087 Option C).
            #
            # 160 MiB liegen über dem gemessenen Verbrauch und unter dem Limit.
            # Kostet nichts, solange die Summe der Requests unter allocatable
            # bleibt - aktuell rund 960 MiB von 7285.
            requests: { cpu: 10m, memory: 160Mi }
            limits: { cpu: 200m, memory: 192Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: true
            runAsUser: 65532
            runAsGroup: 65532
      volumes:
        - name: receipts
          persistentVolumeClaim:
            claimName: homeflow-receipts
      terminationGracePeriodSeconds: 15
