# Example only. Copy to secret.local.yaml, replace every value and apply it
# manually. secret.local.yaml is ignored by Git and is not in kustomization.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: homeflow-secrets
  namespace: homeflow
type: Opaque
stringData:
  POSTGRES_PASSWORD: replace-with-a-long-random-local-password
  HOMEFLOW_DATABASE_URL: postgres://homeflow:replace-with-a-long-random-local-password@postgres:5432/homeflow?sslmode=disable
  HOMEFLOW_USER1_USERNAME: person1
  HOMEFLOW_USER1_DISPLAY_NAME: Person 1
  HOMEFLOW_USER1_PASSWORD: replace-with-a-strong-password-of-at-least-12-characters
  HOMEFLOW_USER2_USERNAME: person2
  HOMEFLOW_USER2_DISPLAY_NAME: Person 2
  HOMEFLOW_USER2_PASSWORD: replace-with-another-strong-password-of-at-least-12-characters
