# Netzisolation für den Monitoring-Stack (Namespace: homeflow-monitoring)
#
# Diese Policies werden auf dem lokalen kind-Cluster ERZWUNGEN — kindnetd
# bringt kube-network-policies als NRI-Plugin mit, nachgewiesen in HF-0015.
# Ein falscher Selektor bricht damit echten Verkehr, statt folgenlos zu
# bleiben. Jede Änderung hier wird getestet, nicht nur gerendert.
#
# `kubernetes/base/networkpolicy.yaml` hatte diese Datei angekündigt und auf
# den Moment vertagt, in dem der Stack wirklich läuft. Der ist erreicht
# (HF-0088): bis dahin lief das Monitoring vollständig ohne Regel, und Grafana
# hat beim Start versucht, Plugins von grafana.com nachzuladen.
#
# `kubectl port-forward` braucht hier keine Regel: es läuft über den Node in
# den Pod-Namespace und damit am CNI-Datenpfad vorbei. Dasselbe gilt für die
# Kubelet-Probes.
---
# Grundregel: alles verboten, was nicht ausdrücklich erlaubt ist. Das ist die
# Regel, die den Griff nach grafana.com beendet.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: homeflow-monitoring
  labels:
    app.kubernetes.io/part-of: homeflow
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# DNS ist die einzige clusterweite Ausnahme; ohne sie löst kein Pod Namen auf.
# Prometheus adressiert seine Ziele über FQDNs, Grafana seine Datenquelle auch.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: homeflow-monitoring
  labels:
    app.kubernetes.io/part-of: homeflow
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
# Prometheus darf genau seine Scrape-Ziele erreichen. Die Ports sind die der
# Container, nicht die der Services: die Regel greift nach der DNAT durch
# kube-proxy. `homeflow-api` hört auf 8080, der Service davor auf 80.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prometheus-egress-scrape
  namespace: homeflow-monitoring
  labels:
    app.kubernetes.io/part-of: homeflow
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: homeflow
          podSelector:
            matchLabels:
              app.kubernetes.io/name: homeflow-api
      ports:
        - { protocol: TCP, port: 8080 }
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kube-state-metrics
      ports:
        - { protocol: TCP, port: 8080 }
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
      ports:
        - { protocol: TCP, port: 3000 }
---
# Der cAdvisor-Scrape läuft über den Node-Proxy des API-Servers
# (`/api/v1/nodes/<name>/proxy/metrics/cadvisor`), das Ziel ist also
# `kubernetes.default.svc`. Dafür gibt es keinen Pod-Selektor - der API-Server
# läuft im Host-Netz, nicht als auswählbarer Pod, deshalb ein ipBlock.
#
# WICHTIG, weil es sonst falsch gelesen wird: **diese Regel wird nicht
# erzwungen.** Am 2026-09-01 in HF-0092 gemessen - ein Probe-Pod, für den nur
# `default-deny` und DNS gelten, erreicht 172.18.0.3:6443 und 10.96.0.1:443
# trotzdem, während er 10.244.0.18:9090 (ein anderer Pod) nicht erreicht.
# kube-network-policies filtert den Pod-zu-Pod-Datenpfad; Ziele im Host-Netz
# des eigenen Knotens gehen daran vorbei, genauso wie Port-Forward und
# Kubelet-Probes in der Gegenrichtung.
#
# Die Regel bleibt trotzdem stehen, aus zwei Gründen: sie schreibt auf, wer
# wohin sprechen darf, und unter einem CNI, das es erzwingt (Calico, Cilium),
# wirkt sie sofort. Sie als Sicherheitskontrolle zu verkaufen wäre falsch -
# die Lücke ist als HF-0093 festgehalten.
#
# `172.18.0.0/16` auf Port 6443 reicht: die zuvor zusätzlich erlaubten
# 10.96.0.1/32 und Port 443 waren geraten und sind nach der Messung entfernt.
# Das /16 ist bewusst breiter als die heutige Node-IP - ein /32 bräche beim
# nächsten `kind create cluster` still, und in dem Netz liegt nur dieser
# Cluster.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: monitoring-egress-apiserver
  namespace: homeflow-monitoring
  labels:
    app.kubernetes.io/part-of: homeflow
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [prometheus, kube-state-metrics]
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock: { cidr: 172.18.0.0/16 }
      ports:
        - { protocol: TCP, port: 6443 }
---
# Prometheus wird nur von Grafana abgefragt. Der Benutzerzugriff auf Grafana
# selbst läuft über den Port-Forward und braucht keine Regel.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prometheus-ingress-grafana
  namespace: homeflow-monitoring
  labels:
    app.kubernetes.io/part-of: homeflow
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
      ports:
        - { protocol: TCP, port: 9090 }
---
# kube-state-metrics liefert an Prometheus und an sonst niemanden. Port 8081
# (Telemetrie über sich selbst) wird von keinem Scrape-Job verwendet und bleibt
# deshalb zu.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kube-state-metrics-ingress-prometheus
  namespace: homeflow-monitoring
  labels:
    app.kubernetes.io/part-of: homeflow
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kube-state-metrics
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - { protocol: TCP, port: 8080 }
---
# Grafana wird von Prometheus gescrapt - siehe den Job `grafana`, der
# grafana_plugin_build_info holt. Der Benutzerzugriff läuft weiterhin über den
# Port-Forward und braucht keine Regel.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grafana-ingress-prometheus
  namespace: homeflow-monitoring
  labels:
    app.kubernetes.io/part-of: homeflow
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - { protocol: TCP, port: 3000 }
---
# Grafana spricht ausschließlich mit Prometheus. Kein Internet-Egress: die
# einzige Datenquelle liegt im selben Namespace, und Plugins werden nicht
# nachgeladen (ADR 0005, `GF_PLUGINS_PREINSTALL_DISABLED`).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grafana-egress-prometheus
  namespace: homeflow-monitoring
  labels:
    app.kubernetes.io/part-of: homeflow
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - { protocol: TCP, port: 9090 }
