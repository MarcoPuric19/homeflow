apiVersion: v1
kind: ServiceAccount
metadata: { name: kube-state-metrics, namespace: homeflow-monitoring }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: homeflow-kube-state-metrics }
rules:
  - apiGroups: [""]
    resources: ["configmaps", "limitranges", "namespaces", "nodes", "persistentvolumeclaims", "persistentvolumes", "pods", "replicationcontrollers", "resourcequotas", "services"]
    verbs: ["list", "watch"]
  - apiGroups: ["apps"]
    resources: ["daemonsets", "deployments", "replicasets", "statefulsets"]
    verbs: ["list", "watch"]
  - apiGroups: ["batch"]
    resources: ["cronjobs", "jobs"]
    verbs: ["list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["list", "watch"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses", "volumeattachments"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: homeflow-kube-state-metrics }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: homeflow-kube-state-metrics }
subjects:
  - { kind: ServiceAccount, name: kube-state-metrics, namespace: homeflow-monitoring }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: kube-state-metrics, namespace: homeflow-monitoring }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: kube-state-metrics } }
  template:
    metadata: { labels: { app.kubernetes.io/name: kube-state-metrics, app.kubernetes.io/part-of: homeflow } }
    spec:
      serviceAccountName: kube-state-metrics
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.18.0
          args:
            - --namespaces=homeflow,homeflow-monitoring
            - --resources=pods,deployments,statefulsets,replicasets,persistentvolumeclaims,nodes
          ports:
            - { name: metrics, containerPort: 8080 }
            - { name: telemetry, containerPort: 8081 }
          startupProbe:
            httpGet: { path: /healthz, port: metrics }
            periodSeconds: 5
            failureThreshold: 12
            timeoutSeconds: 5
          readinessProbe:
            httpGet: { path: /readyz, port: telemetry }
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /livez, port: metrics }
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 5
          resources:
            # 32 MiB angefordert, 63 MiB gemessen (HF-0086). Ein Request unter dem echten
            # Verbrauch schiebt den Pod auf der Kill-Liste des
            # Host-Kernels nach vorn.
            requests: { cpu: 10m, memory: 64Mi }
            limits: { cpu: 100m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata: { name: kube-state-metrics, namespace: homeflow-monitoring }
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: kube-state-metrics }
  ports: [{ name: metrics, port: 8080, targetPort: metrics }]
